<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AfiliFlow 🚀</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: white; border-radius: 16px; padding: 24px; margin-bottom: 16px; }
        h1 { color: white; text-align: center; margin-bottom: 20px; }
        h2 { font-size: 18px; color: #333; margin-bottom: 12px; }
        .status { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #10b981; }
        .info { color: #666; font-size: 14px; line-height: 1.6; }
        code { background: #f3f4f6; padding: 4px 8px; border-radius: 4px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 AfiliFlow</h1>
        
        <div class="card">
            <h2>✅ Sistema Online</h2>
            <div class="status"><span class="dot"></span> Bot ativo</div>
            <div class="status"><span class="dot"></span> Conectado ao Supabase</div>
        </div>
        
        <div class="card">
            <h2>📖 Comandos do Telegram</h2>
            <div class="info">
                <p><code>/start</code> — Iniciar</p>
                <p><code>/adicionargrupo</code> — Cadastrar grupo</p>
                <p><code>/listagrupos</code> — Ver grupos</p>
                <p><code>/removergrupo</code> — Remover grupo</p>
                <p><code>/status</code> — Status do sistema</p>
            </div>
        </div>
    </div>
</body>
</html>
