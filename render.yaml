services:
  - type: web
    name: afiliflow-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SHOPEE_PARTNER_ID
        sync: false
      - key: SHOPEE_API_KEY
        sync: false
      - key: SHOPEE_API_URL
        value: https://open.shopee.com
